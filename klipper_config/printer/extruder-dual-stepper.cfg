[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA5
control: pid
pid_Kp: 37.945
pid_Ki: 22.997
pid_Kd: 15.652
min_temp: 0
max_temp: 250
min_extrude_temp: 50
max_extrude_only_distance: 100
max_extrude_only_velocity: 100

[extruder_stepper stepper1]
extruder: extruder
step_pin: PD5
dir_pin: !PD6
enable_pin: virtual_pin:extruder_stepper__stepper1__enable_pin
microsteps: 16
rotation_distance: 33.683

[extruder_stepper stepper2]
extruder: extruder
step_pin: PC7
dir_pin: !PD4
enable_pin: virtual_pin:extruder_stepper__stepper2__enable_pin
microsteps: 16
rotation_distance: 33.683

[heater_fan heater_fan]
pin: virtual_pin:heater_fan__heater_fan__pin
off_below: 0.0
shutdown_speed: 1.0
max_power: 1.0
